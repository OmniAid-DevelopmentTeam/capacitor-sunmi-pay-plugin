ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.1.5'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.5.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.sunmi.capacitor.pay"
    compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 33
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 33
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        // Disable build features to minimize published artifacts
        aidl false
        renderScript false
        resValues false
        shaders false
    }

    lint {
        // Minimal lint config - consuming apps will skip this module's lint
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Configure jniLibs directory
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

// Configure for plugin with local AAR dependencies
afterEvaluate {
    // Disable AAR bundling - this plugin is consumed as source code by Capacitor apps
    tasks.matching { task ->
        task.name.startsWith('bundle') && task.name.endsWith('Aar')
    }.configureEach {
        enabled = false
    }

    // Disable all lint tasks - AGP 8.7+ cannot create intermediate AAR with local .aar deps
    tasks.matching { task ->
        task.name.startsWith('lint') ||
        task.name.contains('Lint') ||
        task.name.contains('AndroidTest')
    }.configureEach {
        enabled = false
    }

    // Critical: Prevent this module from being included in consuming app's lint dependency graph
    // This stops the consuming app from trying to resolve local_aar_for_lint/out.aar
    configurations.configureEach { config ->
        if (config.name.contains('lintPublish') || config.name.contains('lintModel')) {
            config.canBeConsumed = false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    compileOnly "com.capacitorjs:core:5.0.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    // Sunmi Printer Library for high-level printing API
    implementation("com.sunmi:printerlibrary:1.0.22")
}

